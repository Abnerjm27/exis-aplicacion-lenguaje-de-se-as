services:
  postgres:
    image: postgres:16-alpine
    container_name: manitas_lsc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manitas_lsc
      POSTGRES_USER: manitas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manitas_dev}
    ports:
      - "5432:5432"
    volumes:
      - manitas_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manitas -d manitas_lsc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  manitas_pgdata:
