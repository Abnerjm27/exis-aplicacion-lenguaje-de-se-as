<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación WebGL Anime Character</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body { margin: 0; background: #070c18; overflow: hidden; font-family: sans-serif; }
    #info {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.85); color: #38bdf8;
      border: 1px solid #0284c7; border-radius: 8px; padding: 12px 16px;
      font-size: 13px; font-family: monospace; line-height: 1.5;
    }
    #status { color: #4ade80; font-weight: bold; }
    #errors { color: #f87171; }
  </style>
</head>
<body>
  <div id="info">
    <div>[EXIS 3D] Anime Character WebGL Tester</div>
    <div id="status">Cargando modelo...</div>
    <div id="bones_count">Huesos: -</div>
    <div id="errors"></div>
  </div>
  <canvas id="canvas" style="width: 100vw; height: 100vh; display: block;"></canvas>

  <script>
    const errors = [];
    window.addEventListener('error', (e) => {
      errors.push(e.message);
      document.getElementById('errors').innerText = 'Errores: ' + errors.join('; ');
    });

    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070c18);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.40, 1.75);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;

    // Studio lights matching avatar-3d.js
    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(0, 2.0, 3.0);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x06b6d4, 1.5);
    rim.position.set(2.5, 2.0, -2.0);
    scene.add(rim);

    const fill = new THREE.DirectionalLight(0x6366f1, 0.85);
    fill.position.set(-2.5, 1.5, 1.5);
    scene.add(fill);

    const grid = new THREE.GridHelper(10, 25, 0x4338ca, 0x1e293b);
    grid.position.y = 0;
    scene.add(grid);

    const bonesMap = {};
    const loader = new THREE.GLTFLoader();

    loader.load(
      'models/anime_character.glb',
      (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        model.rotation.y = Math.PI;
        scene.add(model);

        model.traverse((n) => {
          if (n.isBone) {
            bonesMap[n.name] = n;
          }
        });

        const boneNames = Object.keys(bonesMap);
        console.log("Modelo Anime cargado. Total huesos:", boneNames.length);
        document.getElementById('status').innerText = 'Estado: Cargado exitosamente (WebGL OK)';
        document.getElementById('bones_count').innerText = 'Total Huesos: ' + boneNames.length;
        document.title = 'SUCCESS_BONES_' + boneNames.length;

        // Test HOLA posture (Right hand greeting at temple level)
        if (bonesMap['RightArm']) bonesMap['RightArm'].rotation.set(0.20, -0.20, -0.50);
        if (bonesMap['RightForeArm']) bonesMap['RightForeArm'].rotation.set(0.0, 1.70, 0.0);
        if (bonesMap['RightHand']) bonesMap['RightHand'].rotation.set(0.0, 0.0, 0.20);

        if (bonesMap['LeftArm']) bonesMap['LeftArm'].rotation.set(0.0, 0.0, 1.25);
        if (bonesMap['LeftForeArm']) bonesMap['LeftForeArm'].rotation.set(0.0, 0.0, 0.0);

        window.__ANIME_LOADED__ = true;
      },
      undefined,
      (err) => {
        console.error("Error cargando GLB:", err);
        document.getElementById('status').innerText = 'Error al cargar';
        document.getElementById('errors').innerText = err.message || String(err);
        document.title = 'ERROR_' + (err.message || String(err));
        window.__ANIME_ERROR__ = true;
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
