<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu nivel de LSC · Manitas</title>
  <link rel="icon" type="image/svg+xml" href="img/manitas-icono-app.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <script src="lib/tailwind/tailwind.js"></script>
  <script src="js/tailwind-config.js?v=20261116_v6"></script>
  <link rel="stylesheet" href="css/tokens.css?v=20261116_v6">
  <link rel="stylesheet" href="css/landing.css?v=20261116_v6">
  <link rel="stylesheet" href="css/auth.css?v=20261116_v6">
  <script src="js/auth-service.js" defer></script>
  <script src="js/onboarding.js" defer></script>
</head>
<body class="text-slate-900 antialiased relative selection:bg-amber-500 selection:text-slate-900">
  <div class="ambient-beam-amber" aria-hidden="true"></div>
  <div class="hologram-grid-floor" aria-hidden="true"></div>
  <main class="onboarding-wrap">    <div class="quiz-wizard-card max-w-xl w-full p-6 sm:p-8 rounded-3xl flex flex-col gap-6 relative">
      
      <!-- Barra superior de progreso del cuestionario -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs font-mono">
          <span id="quizStepBadge" class="text-amber-700 font-bold tabular-nums">PREGUNTA 1 DE 3</span>
          <button id="btnSkipQuiz" type="button" class="text-slate-600 hover:text-slate-900 text-xs font-semibold min-h-[44px] inline-flex items-center px-2 rounded-lg">
            Saltar diagnóstico ➔
          </button>
        </div>
        <div class="w-full h-2 rounded-full bg-slate-200 overflow-hidden">
          <div id="quizProgressBar" class="h-full bg-amber-500 transition-all duration-300 w-1/3"></div>
        </div>
      </div>

      <!-- PASO 1: ¿Cuánto sabes de Lengua de Señas Colombiana? -->
      <div id="quizStep1" class="quiz-step-pane flex flex-col gap-4">
        <div class="flex items-center gap-3.5">
          <img src="img/zorrito/svg/zorrito_pensando.svg" alt="Tito Pensando" class="w-14 h-14 shrink-0 drop-shadow-md">
          <div>
            <h1 id="quizModalTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900">¿Cuánto sabes de LSC?</h1>
            <p class="text-xs sm:text-sm text-slate-600 mt-0.5">Tito, tu tutor, adaptará la dificultad a tu nivel.</p>
          </div>
        </div>

        <div class="flex flex-col gap-2.5">
          <button type="button" data-quiz-level="Principiante" data-quiz-goal="No sé nada, enséñame lo básico desde cero" class="quiz-option-card is-selected p-4 rounded-2xl text-left flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-bold text-slate-900">No sé nada · Empezar desde cero</div>
              <div class="text-xs text-slate-600 mt-0.5">Es mi primera vez aprendiendo Lengua de Señas Colombiana.</div>
            </div>
            <span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800 border border-amber-300 font-mono text-[11px] font-bold shrink-0">Nivel 1</span>
          </button>

          <button type="button" data-quiz-level="Intermedio" data-quiz-goal="Quiero dominar el abecedario dactilológico completo" class="quiz-option-card p-4 rounded-2xl text-left flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-bold text-slate-900">Conozco algunas letras o señas sueltas</div>
              <div class="text-xs text-slate-600 mt-0.5">Sé algunas vocales pero quiero dominar el abecedario y palabras.</div>
            </div>
            <span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-300 font-mono text-[11px] font-bold shrink-0">Nivel 2</span>
          </button>

          <button type="button" data-quiz-level="Avanzado LSC" data-quiz-goal="Quiero practicar saludos, presentación personal y conversación" class="quiz-option-card p-4 rounded-2xl text-left flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-bold text-slate-900">Ya conozco lo básico · Quiero conversar y certificarme</div>
              <div class="text-xs text-slate-600 mt-0.5">Quiero practicar frases, saludos y probarme en el Modo Examen Sin Video.</div>
            </div>
            <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border border-slate-300 font-mono text-[11px] font-bold shrink-0">Nivel 3</span>
          </button>
        </div>
      </div>

      <!-- PASO 2: ¿Por qué quieres aprender LSC? -->
      <div id="quizStep2" class="quiz-step-pane hidden flex-col gap-4">
        <div class="flex items-center gap-3.5">
          <img src="img/zorrito/svg/zorrito_explicando.svg" alt="Tito Tutor" class="w-14 h-14 shrink-0 drop-shadow-md">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">¿Cuál es tu enfoque principal?</h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-0.5">Priorizaremos las unidades que más te sirvan desde el primer día.</p>
          </div>
        </div>

        <div class="flex flex-col gap-2.5">
          <button type="button" data-quiz-focus="No sé nada, enséñame desde cero paso a paso" class="quiz-focus-card is-selected p-4 rounded-2xl text-left flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-bold text-slate-900">Ruta Completa Guiada por Tito IA (Recomendada)</div>
              <div class="text-xs text-slate-600 mt-0.5">Combina saludo inicial, vocales esenciales y presentación personal.</div>
            </div>
          </button>

          <button type="button" data-quiz-focus="Quiero aprender el abecedario dactilológico en señas" class="quiz-focus-card p-4 rounded-2xl text-left flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-bold text-slate-900">Dominar el Abecedario Dactilológico</div>
              <div class="text-xs text-slate-600 mt-0.5">Enfoque 100% en deletreo manual con precisión anatómica.</div>
            </div>
          </button>

          <button type="button" data-quiz-focus="Quiero aprender palabras, saludos y presentación personal" class="quiz-focus-card p-4 rounded-2xl text-left flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-bold text-slate-900">Comunicación y Saludos Cotidianos</div>
              <div class="text-xs text-slate-600 mt-0.5">Aprende HOLA, BUENOS DÍAS, TARDES, NOCHES, YO, NOMBRE y más.</div>
            </div>
          </button>
        </div>
      </div>

      <!-- PASO 3: Meta Diaria y Personalización con Tito IA -->
      <div id="quizStep3" class="quiz-step-pane hidden flex-col gap-4">
        <div class="flex items-center gap-3.5">
          <img src="img/zorrito/svg/zorrito_pulgar.svg" alt="Tito Ánimo" class="w-14 h-14 shrink-0 drop-shadow-md">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">¡Todo listo! ¿Cuánto tiempo al día?</h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-0.5">Tito te acompañará y registrará tus rachas de estudio.</p>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <button type="button" data-quiz-mins="5" class="quiz-time-card p-3 rounded-xl text-center">
            <div class="text-base font-extrabold text-amber-700 font-mono tabular-nums">5 min</div>
            <div class="text-[11px] text-slate-600">Casual</div>
          </button>
          <button type="button" data-quiz-mins="10" class="quiz-time-card is-selected p-3 rounded-xl text-center">
            <div class="text-base font-extrabold text-amber-700 font-mono tabular-nums">10 min</div>
            <div class="text-[11px] text-slate-600">Constante</div>
          </button>
          <button type="button" data-quiz-mins="20" class="quiz-time-card p-3 rounded-xl text-center">
            <div class="text-base font-extrabold text-emerald-700 font-mono tabular-nums">20 min</div>
            <div class="text-[11px] text-slate-600">Intensivo</div>
          </button>
        </div>

        <div class="pt-2">
          <label for="quizCustomGoalInput" class="block text-xs font-semibold text-amber-800 mb-1.5">
            O escríbele a Tito IA tu objetivo con tus propias palabras (opcional):
          </label>
          <input 
            id="quizCustomGoalInput" 
            type="text" 
            placeholder="Ej: No sé nada, enséñame lo básico para saludar..." 
            class="auth-field-input w-full px-3.5 py-2.5 min-h-[44px] rounded-xl text-xs text-slate-900 placeholder-slate-500"
          />
        </div>
      </div>

      <!-- Botones de navegación del cuestionario -->
      <div class="flex items-center justify-between gap-3 pt-3 border-t border-slate-200">
        <button id="btnQuizPrev" type="button" class="hidden btn-spring px-4 py-2.5 min-h-[48px] rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 shrink-0">
          ← Anterior
        </button>
        <div class="flex-1"></div>
        <button id="btnQuizNext" type="button" class="btn-spring auth-submit-btn px-5 sm:px-6 py-3 min-h-[48px] rounded-xl text-xs sm:text-sm font-extrabold text-slate-950 flex items-center gap-2">
          <span id="btnQuizNextText">Siguiente paso</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>

    </div>
  </main>
</body>
</html>
