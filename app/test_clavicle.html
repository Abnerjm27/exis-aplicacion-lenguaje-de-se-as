<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head><body><pre id="output"></pre><script>
new THREE.GLTFLoader().load('models/human_player.glb', (gltf) => {
  const scene = new THREE.Scene();
  scene.add(gltf.scene);
  const bones = {};
  gltf.scene.traverse(n => { if (n.isBone) bones[n.name] = n; });

  const rArm = bones['RightArm'];
  const rFore = bones['RightForeArm'];
  const rHand = bones['RightHand'];
  const rMiddle = bones['RightHandMiddle3'];

  const rH = new THREE.Vector3();
  const rM = new THREE.Vector3();

  let bestDist = Infinity;
  let bestParams = null;
  let bestH = null, bestM = null;

  // Target: Hand at clavicle/upper chest: x = -0.16, y = 1.47, z = 0.25
  const target = new THREE.Vector3(-0.16, 1.47, 0.25);

  for (let raX = 0.0; raX <= 0.6; raX += 0.08) {
    for (let raY = -0.4; raY <= 0.4; raY += 0.1) {
      for (let raZ = -1.35; raZ <= -0.9; raZ += 0.08) {
        rArm.rotation.set(raX, raY, raZ);
        for (let rfX = -1.6; rfX <= -0.5; rfX += 0.1) {
          for (let rfY = 0.0; rfY <= 1.0; rfY += 0.15) {
            for (let rfZ = -0.3; rfZ <= 0.3; rfZ += 0.15) {
              rFore.rotation.set(rfX, rfY, rfZ);
              gltf.scene.updateMatrixWorld(true);
              rHand.getWorldPosition(rH);
              rMiddle.getWorldPosition(rM);

              const d = rH.distanceTo(target);
              // Ensure fingers point upward (rM.y > rH.y)
              if (rM.y > rH.y + 0.08 && d < bestDist) {
                bestDist = d;
                bestParams = { ra: [raX, raY, raZ], rf: [rfX, rfY, rfZ] };
                bestH = [rH.x.toFixed(3), rH.y.toFixed(3), rH.z.toFixed(3)];
                bestM = [rM.x.toFixed(3), rM.y.toFixed(3), rM.z.toFixed(3)];
              }
            }
          }
        }
      }
    }
  }

  document.getElementById('output').textContent = JSON.stringify({
    dist: bestDist.toFixed(3),
    params: bestParams,
    handPos: bestH,
    middlePos: bestM
  }, null, 2);
  document.title = 'READY';
});
</script></body></html>
