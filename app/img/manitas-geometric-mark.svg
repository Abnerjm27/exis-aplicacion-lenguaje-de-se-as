<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="Manitas - Manos M">
  <defs>
    <linearGradient id="geomBg" x1="15" y1="15" x2="145" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2B4D"/>
      <stop offset="100%" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="leftHand" x1="20" y1="30" x2="80" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4DD8CC"/>
      <stop offset="100%" stop-color="#00B8A9"/>
    </linearGradient>
    <linearGradient id="rightHand" x1="140" y1="30" x2="80" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC857"/>
      <stop offset="50%" stop-color="#FF8A7C"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="14" y="14" width="132" height="132" rx="38" fill="url(#geomBg)" stroke="#2A3B63" stroke-width="2.5"/>

  <!-- SÍMBOLO: Dos manos entrelazadas formando silueta de M y Corazón -->
  <g filter="url(#mShadow)">
    <!-- Curva mano izquierda (Turquesa Cámara) -->
    <path d="M80 62 C70 42 46 36 32 50 C18 64 20 88 32 102 C36 107 42 112 50 114" 
          stroke="url(#leftHand)" stroke-width="13" stroke-linecap="round" fill="none"/>

    <!-- 4 Dedos estilizados mano izquierda -->
    <path d="M48 84 L64 84" stroke="url(#leftHand)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M44 94 L62 94" stroke="url(#leftHand)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M40 104 L58 104" stroke="url(#leftHand)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M36 114 L50 114" stroke="url(#leftHand)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Curva mano derecha (Amarillo a Coral) -->
    <path d="M80 62 C90 42 114 36 128 50 C142 64 140 88 128 102 C124 107 118 112 110 114" 
          stroke="url(#rightHand)" stroke-width="13" stroke-linecap="round" fill="none"/>

    <!-- 4 Dedos estilizados mano derecha -->
    <path d="M112 84 L96 84" stroke="url(#rightHand)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M116 94 L98 94" stroke="url(#rightHand)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M120 104 L102 104" stroke="url(#rightHand)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M124 114 L110 114" stroke="url(#rightHand)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Cúspide central del corazón y 'M' con destello de unión -->
    <circle cx="80" cy="62" r="5" fill="#FFC857"/>
  </g>
</svg>
