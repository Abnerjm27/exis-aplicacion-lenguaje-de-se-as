<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body style="margin:0; background:#0b1120; overflow:hidden;">
  <canvas id="c" style="width:100vw; height:100vh; display:block;"></canvas>
  <div id="metrics" style="position:absolute; top:10px; left:10px; color:#38bdf8; font-family:monospace; font-size:14px; background:rgba(0,0,0,0.7); padding:8px;"></div>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;

    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(0.5, 2.0, 2.5);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0x38bdf8, 1.1);
    rim.position.set(-2, 2, -2);
    scene.add(rim);

    const p = new URLSearchParams(window.location.search);
    const ra = (p.get('ra') || '0,0,0').split(',').map(Number);
    const rf = (p.get('rf') || '0,0,0').split(',').map(Number);
    const rh = (p.get('rh') || '0,0,0').split(',').map(Number);
    const la = (p.get('la') || '0,0,0').split(',').map(Number);
    const lf = (p.get('lf') || '0,0,0').split(',').map(Number);
    const lh = (p.get('lh') || '0,0,0').split(',').map(Number);

    const view = p.get('view') || 'body'; // body or hand
    const targetType = p.get('target') || 'temple'; // temple, chest, chin, cross

    const loader = new THREE.GLTFLoader();
    loader.load('models/human_player.glb', (gltf) => {
      scene.add(gltf.scene);
      const bones = {};
      gltf.scene.traverse(n => { if (n.isBone) bones[n.name] = n; });

      // Apply rotations
      if (bones['RightArm']) bones['RightArm'].rotation.set(ra[0], ra[1], ra[2]);
      if (bones['RightForeArm']) bones['RightForeArm'].rotation.set(rf[0], rf[1], rf[2]);
      if (bones['RightHand']) bones['RightHand'].rotation.set(rh[0], rh[1], rh[2]);

      if (bones['LeftArm']) bones['LeftArm'].rotation.set(la[0], la[1], la[2]);
      if (bones['LeftForeArm']) bones['LeftForeArm'].rotation.set(lf[0], lf[1], lf[2]);
      if (bones['LeftHand']) bones['LeftHand'].rotation.set(lh[0], lh[1], lh[2]);

      // Finger curls
      const curlRatio = parseFloat(p.get('curl') || '0.0');
      const angle = curlRatio * 1.30;
      ['Index', 'Middle', 'Ring', 'Pinky'].forEach(f => {
        for (let i = 1; i <= 3; i++) {
          const b = bones['RightHand' + f + i];
          if (b) b.rotation.x = angle;
        }
      });

      gltf.scene.updateMatrixWorld(true);

      const headPos = new THREE.Vector3();
      const chestPos = new THREE.Vector3();
      const rHandPos = new THREE.Vector3();
      const lHandPos = new THREE.Vector3();

      bones['Head'].getWorldPosition(headPos);
      (bones['Spine2'] || bones['Spine1']).getWorldPosition(chestPos);
      bones['RightHand'].getWorldPosition(rHandPos);
      bones['LeftHand'].getWorldPosition(lHandPos);

      const templePos = headPos.clone().add(new THREE.Vector3(0.09, 0.03, 0.04));
      const chinPos = headPos.clone().add(new THREE.Vector3(0.0, -0.11, 0.08));

      let dist = 0;
      if (targetType === 'temple') dist = rHandPos.distanceTo(templePos);
      else if (targetType === 'chest') dist = rHandPos.distanceTo(chestPos);
      else if (targetType === 'chin') dist = rHandPos.distanceTo(chinPos);
      else if (targetType === 'cross') dist = rHandPos.distanceTo(lHandPos);

      const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 50);
      if (view === 'hand') {
        camera.position.set(rHandPos.x, rHandPos.y, rHandPos.z + 0.35);
        camera.lookAt(rHandPos.x, rHandPos.y, rHandPos.z);
      } else {
        // Supervisor required: camera.position (0, 1.35, 1.9), target (0, 1.30, 0)
        camera.position.set(0, 1.35, 1.9);
        camera.lookAt(0, 1.30, 0);
      }

      renderer.render(scene, camera);

      const report = `TARGET: ${targetType} | DIST: ${dist.toFixed(3)}m | RHand: (${rHandPos.x.toFixed(3)}, ${rHandPos.y.toFixed(3)}, ${rHandPos.z.toFixed(3)}) | LHand: (${lHandPos.x.toFixed(3)}, ${lHandPos.y.toFixed(3)}, ${lHandPos.z.toFixed(3)})`;
      document.getElementById('metrics').textContent = report;
      document.title = `DIST_${dist.toFixed(3)}`;
    });
  </script>
</body>
</html>
