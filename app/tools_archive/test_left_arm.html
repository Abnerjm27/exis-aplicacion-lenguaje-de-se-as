<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body style="margin:0; background:#0b1120; overflow:hidden;">
  <canvas id="c" style="width:100vw; height:100vh; display:block;"></canvas>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;

    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(0.5, 2.0, 2.5);
    scene.add(dir);

    const p = new URLSearchParams(window.location.search);
    const la = (p.get('la') || '0,0,0').split(',').map(Number);
    const lf = (p.get('lf') || '0,0,0').split(',').map(Number);

    new THREE.GLTFLoader().load('models/human_player.glb', (gltf) => {
      scene.add(gltf.scene);
      const bones = {};
      gltf.scene.traverse(n => { if (n.isBone) bones[n.name] = n; });

      // Lower right arm naturally
      if (bones['RightArm']) bones['RightArm'].rotation.set(0.15, 0.0, -1.28);
      if (bones['RightForeArm']) bones['RightForeArm'].rotation.set(-0.15, 0.0, 0.0);

      // Left arm test
      if (bones['LeftArm']) bones['LeftArm'].rotation.set(la[0], la[1], la[2]);
      if (bones['LeftForeArm']) bones['LeftForeArm'].rotation.set(lf[0], lf[1], lf[2]);

      const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 50);
      camera.position.set(0, 1.35, 1.9);
      camera.lookAt(0, 1.30, 0);

      renderer.render(scene, camera);
      document.title = 'TEST_LEFT_ARM';
    });
  </script>
</body>
</html>
