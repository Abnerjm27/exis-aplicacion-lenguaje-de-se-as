<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body style="margin:0; background:#0f172a; overflow:hidden;">
  <canvas id="c" style="width:100vw; height:100vh; display:block;"></canvas>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.40, 1.65);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.30, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(1.5, 3, 2.5);
    scene.add(dir);

    const rim = new THREE.DirectionalLight(0x06b6d4, 1.2);
    rim.position.set(-2, 2, -2);
    scene.add(rim);

    let bones = {};
    const loader = new THREE.GLTFLoader();
    loader.load('models/human_player.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      model.traverse((n) => {
        if (n.isBone) {
          bones[n.name] = n;
        }
      });
      console.log('Bones loaded:', Object.keys(bones).length);
    });

    let clock = new THREE.Clock();
    function anim() {
      requestAnimationFrame(anim);
      const time = clock.getElapsedTime();

      if (bones['LeftArm']) {
        // Lower left arm naturally
        bones['LeftArm'].rotation.z = 1.28;
        bones['LeftArm'].rotation.x = 0.15;
      }
      if (bones['RightArm'] && bones['RightForeArm'] && bones['RightHand']) {
        // Raise right arm to head and wave
        bones['RightArm'].rotation.z = -0.35;
        bones['RightArm'].rotation.x = 0.45;
        bones['RightArm'].rotation.y = -0.3;

        bones['RightForeArm'].rotation.z = -0.6;
        bones['RightForeArm'].rotation.x = -1.1;

        // Wave hand side to side
        bones['RightHand'].rotation.y = Math.sin(time * 3.5) * 0.35;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    anim();
  </script>
</body>
</html>
