<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head><body style="margin:0; background:#0b1120; overflow:hidden;">
<canvas id="c" style="width:500px; height:500px; display:block;"></canvas>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1120);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(500, 500);
renderer.outputEncoding = THREE.sRGBEncoding;
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(0.5, 2.0, 2.5);
scene.add(dir);

new THREE.GLTFLoader().load('models/human_player.glb', (gltf) => {
  scene.add(gltf.scene);
  const bones = {};
  gltf.scene.traverse(n => { if (n.isBone) bones[n.name] = n; });

  // Natural resting left arm
  bones['LeftArm'].rotation.set(1.15, 0.0, -0.25);
  bones['LeftForeArm'].rotation.set(-0.15, 0.0, 0.0);

  // Upright dactilological hand pose at shoulder/clavicle height
  // Facing front camera!
  bones['RightArm'].rotation.set(0.40, 0.30, -0.90);
  bones['RightForeArm'].rotation.set(2.10, -0.60, -0.30);
  bones['RightHand'].rotation.set(-0.10, 0.10, -1.15);

  // Fingers
  ['Index', 'Middle', 'Ring', 'Pinky'].forEach(f => {
    for (let i = 1; i <= 3; i++) {
      const b = bones['RightHand' + f + i];
      if (b) {
        b.rotation.x = 0.62 * 1.30;
        if (i === 1) {
          if (f === 'Index') b.rotation.z = 0.0;
          if (f === 'Pinky') b.rotation.z = 0.0;
        }
      }
    }
  });

  // Thumb
  const s = 1;
  let tx = 0, ty = 0, tz = 0;
  if ('c_shape' === 'tucked') {
    tx = 0.20; ty = 0.40 * s; tz = 0.0 * s;
  } else if ('c_shape' === 'c_shape') {
    tx = 0.45; ty = 0.25 * s; tz = -0.45 * s;
  }
  for (let i = 1; i <= 3; i++) {
    const b = bones['RightHandThumb' + i];
    if (b) b.rotation.set(tx, ty, tz);
  }

  gltf.scene.updateMatrixWorld(true);

  const rHand = new THREE.Vector3();
  const middle = new THREE.Vector3();
  bones['RightHand'].getWorldPosition(rHand);
  bones['RightHandMiddle2'].getWorldPosition(middle);
  const centerHand = rHand.clone().lerp(middle, 0.5);

  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 50);
  // Hand camera close-up (z + 0.38m)
  camera.position.set(centerHand.x, centerHand.y, centerHand.z + 0.38);
  camera.lookAt(centerHand.x, centerHand.y, centerHand.z);

  renderer.render(scene, camera);
  document.title = 'READY';
});
</script></body></html>
