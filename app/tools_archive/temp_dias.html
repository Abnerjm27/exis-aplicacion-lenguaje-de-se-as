<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head><body><pre id="p"></pre><script>
new THREE.GLTFLoader().load('models/human_player.glb', (gltf) => {
  const bones = {};
  gltf.scene.traverse(n => { if (n.isBone) bones[n.name] = n; });

  // Current avatar-3d.js DIAS pose:
  bones['RightArm'].rotation.set(0.10, -0.40, -0.55);
  bones['RightForeArm'].rotation.set(-1.35, -0.30, 0.30);
  bones['RightHand'].rotation.set(0.15, -0.15, 0.0);

  bones['LeftArm'].rotation.set(0.10, 0.40, 0.55);
  bones['LeftForeArm'].rotation.set(-1.35, 0.30, -0.30);
  bones['LeftHand'].rotation.set(0.15, 0.15, 0.0);

  gltf.scene.updateMatrixWorld(true);

  const rHand = new THREE.Vector3();
  const lHand = new THREE.Vector3();
  const rTip = new THREE.Vector3();
  const head = new THREE.Vector3();
  bones['RightHand'].getWorldPosition(rHand);
  bones['LeftHand'].getWorldPosition(lHand);
  bones['RightHandMiddle3'].getWorldPosition(rTip);
  bones['Head'].getWorldPosition(head);

  const res = {
    rHand: [rHand.x.toFixed(3), rHand.y.toFixed(3), rHand.z.toFixed(3)],
    lHand: [lHand.x.toFixed(3), lHand.y.toFixed(3), lHand.z.toFixed(3)],
    rTip: [rTip.x.toFixed(3), rTip.y.toFixed(3), rTip.z.toFixed(3)],
    head: [head.x.toFixed(3), head.y.toFixed(3), head.z.toFixed(3)]
  };
  document.getElementById('p').textContent = JSON.stringify(res, null, 2);
  document.title = 'READY';
});
</script></body></html>
