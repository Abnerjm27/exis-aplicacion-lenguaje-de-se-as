<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head><body style="margin:0; background:#0b1120; overflow:hidden;">
<canvas id="c" style="width:600px; height:400px; display:block;"></canvas>
<pre id="p" style="color:white; position:absolute; top:4px; left:4px;"></pre>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1120);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(600, 400);
renderer.outputEncoding = THREE.sRGBEncoding;
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(0.5, 2.0, 2.5);
scene.add(dir);

new THREE.GLTFLoader().load('models/human_player.glb', (gltf) => {
  const bones = {};
  gltf.scene.traverse(n => { if (n.isBone) bones[n.name] = n; });

  const rA = [0.32, -0.35, -0.55];
  const rF = [-1.10, -0.25, 0.30];
  const rH = [0.15, -0.15, 0.0];

  const lA = [rA[0], -rA[1], -rA[2]];
  const lF = [rF[0], -rF[1], -rF[2]];
  const lH = [rH[0], -rH[1], -rH[2]];

  bones['RightArm'].rotation.set(rA[0], rA[1], rA[2]);
  bones['RightForeArm'].rotation.set(rF[0], rF[1], rF[2]);
  bones['RightHand'].rotation.set(rH[0], rH[1], rH[2]);

  bones['LeftArm'].rotation.set(lA[0], lA[1], lA[2]);
  bones['LeftForeArm'].rotation.set(lF[0], lF[1], lF[2]);
  bones['LeftHand'].rotation.set(lH[0], lH[1], lH[2]);

  ['Right', 'Left'].forEach(side => {
    ['Index', 'Middle', 'Ring', 'Pinky'].forEach(f => {
      for (let i = 1; i <= 3; i++) {
        const b = bones[side + 'Hand' + f + i];
        if (b) {
          b.rotation.x = 0;
          if (i === 1) {
            if (f === 'Index') b.rotation.z = (side === 'Right' ? 0.08 : -0.08);
            if (f === 'Pinky') b.rotation.z = (side === 'Right' ? -0.08 : 0.08);
          }
        }
      }
    });
    for (let i = 1; i <= 3; i++) {
      const b = bones[side + 'HandThumb' + i];
      if (b) b.rotation.set(0.1, (side === 'Right' ? 0.15 : -0.15), (side === 'Right' ? -0.2 : 0.2));
    }
  });

  gltf.scene.updateMatrixWorld(true);

  const rHand = new THREE.Vector3();
  const lHand = new THREE.Vector3();
  const rTip = new THREE.Vector3();
  const lTip = new THREE.Vector3();
  const head = new THREE.Vector3();
  bones['RightHand'].getWorldPosition(rHand);
  bones['LeftHand'].getWorldPosition(lHand);
  bones['RightHandMiddle3'].getWorldPosition(rTip);
  bones['LeftHandMiddle3'].getWorldPosition(lTip);
  bones['Head'].getWorldPosition(head);

  // Exact desktop app camera:
  const camera = new THREE.PerspectiveCamera(36, 600/400, 0.1, 50);
  camera.position.set(0, 1.45, 1.65);
  camera.lookAt(0, 1.42, 0);
  camera.updateMatrixWorld();

  const toScreen = (v) => {
    const p = v.clone().project(camera);
    return {
      x: ((p.x + 1)/2 * 600).toFixed(1),
      y: ((-p.y + 1)/2 * 400).toFixed(1),
      raw_y: v.y.toFixed(3)
    };
  };

  renderer.render(scene, camera);

  document.getElementById('p').textContent = JSON.stringify({
    rHand: toScreen(rHand),
    lHand: toScreen(lHand),
    rTip: toScreen(rTip),
    lTip: toScreen(lTip),
    head: toScreen(head)
  }, null, 2);
  document.title = 'READY';
});
</script></body></html>
